<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><style>text{font-family:Arial,sans-serif;fill:#222}.title{font-size:24px;font-weight:bold}.box{fill:#f8f5ed;stroke:#8b6f3d;stroke-width:2}.decision{fill:#fff4d6;stroke:#8b6f3d;stroke-width:2}.note{font-size:14px}.label{font-size:16px;font-weight:bold}.arrow{stroke:#555;stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#555"/></marker></defs><text x="550" y="35" text-anchor="middle" class="title">Fluxo de medicamento fracionável: lote, recipiente e FEFO</text><rect x="35" y="90" width="180" height="70" rx="12" class="box"/><text x="125" y="120" text-anchor="middle" class="label">Recebimento</text><text x="125" y="143" text-anchor="middle" class="note">lote + validade + unidade</text><rect x="270" y="90" width="180" height="70" rx="12" class="box"/><text x="360" y="120" text-anchor="middle" class="label">Criar lote</text><text x="360" y="143" text-anchor="middle" class="note">por produto e filial</text><rect x="505" y="90" width="180" height="70" rx="12" class="box"/><text x="595" y="120" text-anchor="middle" class="label">Criar recipiente</text><text x="595" y="143" text-anchor="middle" class="note">saldo físico inicial</text><polygon points="790,90 900,125 790,160 680,125" class="decision"/><text x="790" y="121" text-anchor="middle" class="note">Permite</text><text x="790" y="140" text-anchor="middle" class="note">fracionar?</text><rect x="945" y="90" width="120" height="70" rx="12" class="box"/><text x="1005" y="120" text-anchor="middle" class="label">Fluxo</text><text x="1005" y="143" text-anchor="middle" class="note">legado</text><path d="M215 125h55M450 125h55M685 125h15M900 125h45" class="arrow"/><text x="925" y="112" class="note">não</text><path d="M790 160v90H360v60" class="arrow"/><text x="805" y="220" class="note">sim</text><rect x="270" y="310" width="180" height="70" rx="12" class="box"/><text x="360" y="340" text-anchor="middle" class="label">FEFO</text><text x="360" y="363" text-anchor="middle" class="note">menor validade utilizável</text><rect x="505" y="310" width="180" height="70" rx="12" class="box"/><text x="595" y="340" text-anchor="middle" class="label">Consumir parcial</text><text x="595" y="363" text-anchor="middle" class="note">movimento decimal</text><rect x="740" y="310" width="180" height="70" rx="12" class="box"/><text x="830" y="340" text-anchor="middle" class="label">Atualizar saldos</text><text x="830" y="363" text-anchor="middle" class="note">lote + recipiente + cache</text><path d="M450 345h55M685 345h55" class="arrow"/><text x="550" y="445" text-anchor="middle" class="note">Validade pós-abertura/reconstituição: cadastro; padrão operacional de 5 dias quando ausente.</text><text x="550" y="475" text-anchor="middle" class="note">Recipiente vencido, sem saldo ou fora do prazo não pode ser selecionado.</text></svg>