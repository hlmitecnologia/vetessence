<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><style>text{font-family:Arial,sans-serif;fill:#222}.title{font-size:24px;font-weight:bold}.box{fill:#f8f5ed;stroke:#8b6f3d;stroke-width:2}.decision{fill:#fff4d6;stroke:#8b6f3d;stroke-width:2}.note{font-size:14px}.label{font-size:16px;font-weight:bold}.arrow{stroke:#555;stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#555"/></marker></defs><text x="550" y="35" text-anchor="middle" class="title">Reserva, Farmácia e administração medicamentosa</text><rect x="40" y="100" width="190" height="75" rx="12" class="box"/><text x="135" y="132" text-anchor="middle" class="label">Veterinário</text><text x="135" y="155" text-anchor="middle" class="note">cria reserva</text><rect x="300" y="100" width="190" height="75" rx="12" class="box"/><text x="395" y="132" text-anchor="middle" class="label">Sistema</text><text x="395" y="155" text-anchor="middle" class="note">registra + notifica</text><rect x="560" y="100" width="190" height="75" rx="12" class="box"/><text x="655" y="132" text-anchor="middle" class="label">Farmácia</text><text x="655" y="155" text-anchor="middle" class="note">separa por FEFO</text><rect x="820" y="100" width="190" height="75" rx="12" class="box"/><text x="915" y="132" text-anchor="middle" class="label">Entrega</text><text x="915" y="155" text-anchor="middle" class="note">reserva atendida</text><path d="M230 137h70M490 137h70M750 137h70" class="arrow"/><polygon points="550,270 690,315 550,360 410,315" class="decision"/><text x="550" y="311" text-anchor="middle" class="note">Administrado?</text><path d="M915 175v140H690" class="arrow"/><text x="730" y="300" class="note">sim</text><rect x="760" y="380" width="220" height="75" rx="12" class="box"/><text x="870" y="412" text-anchor="middle" class="label">Administração</text><text x="870" y="435" text-anchor="middle" class="note">lote + recipiente + usuário</text><rect x="120" y="380" width="220" height="75" rx="12" class="box"/><text x="230" y="412" text-anchor="middle" class="label">Cancelar/devolver</text><text x="230" y="435" text-anchor="middle" class="note">sem baixa definitiva</text><path d="M410 315H230v65M690 315h180v65" class="arrow"/><text x="355" y="305" class="note">não</text><text x="700" y="305" class="note">sim</text><text x="550" y="515" text-anchor="middle" class="note">Criar reserva não reduz definitivamente o estoque; consumo/administração registra o movimento.</text></svg>